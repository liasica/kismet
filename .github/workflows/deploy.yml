name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# 同一时间只跑一次部署，排队执行不取消
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload compose file
        run: scp compose.yaml "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/compose.yaml"

      # 密钥经 stdin 送到远端写入 .env，不出现在任一侧的进程参数里
      - name: Write environment file
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          ssh "$SSH_USER@$SSH_HOST" "umask 077 && cat > '$DEPLOY_PATH/.env'" <<ENVFILE
          IMAGE_TAG=${{ github.sha }}
          DEEPSEEK_API_KEY=$DEEPSEEK_API_KEY
          DEEPSEEK_BASE_URL=$DEEPSEEK_BASE_URL
          DEEPSEEK_MODEL=$DEEPSEEK_MODEL
          ADMIN_PASSWORD=$ADMIN_PASSWORD
          ENVFILE

      - name: Pull image and restart service
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | ssh "$SSH_USER@$SSH_HOST" "
            docker login ghcr.io -u $GH_ACTOR --password-stdin &&
            cd '$DEPLOY_PATH' &&
            docker compose pull &&
            docker compose up -d --remove-orphans &&
            docker logout ghcr.io &&
            docker image prune -f
          "

      - name: Check service health
        run: |
          ssh "$SSH_USER@$SSH_HOST" '
            for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:36579/health || true)
              if [ "$code" = 200 ]; then echo "健康检查通过"; exit 0; fi
              sleep 2
            done
            echo "健康检查失败，最近日志："
            docker logs --tail 50 kismet
            exit 1
          '
